# ============================================================
# Earner Agent configuration
# Fill in the blanks marked with "" to unlock real earning.
# Everything works in safe paper/demo mode until you do.
# ============================================================

agent:
  name: "Earner"
  loop_interval_minutes: 15        # how often strategies re-run

survival:
  daily_target_usd: 10.0           # what the agent must earn per day to "stay alive"
  currency: USD

notifications:
  webhook_url: ""                  # optional Discord/Slack-style webhook for alerts
  ntfy:
    topic: "nmt-leads"                       # optional: ntfy.sh topic (free push, no signup - see README)
    base_url: "https://ntfy.sh"     # default public server; or self-hosted instance
  telegram:
    bot_token: "8450470858:AAEWNYsyIHjADlMQvihtMV9coGW5vqSltPE"                # optional: Telegram bot token (from @BotFather)
    chat_id: "7172940714"          # your Telegram chat/user id (from getUpdates)
    https_proxy: ""                # optional: e.g. socks5h://127.0.0.1:1080 (VPN) if Telegram is blocked

strategies:

  trading_bot:
    enabled: true
    mode: paper                    # paper = simulated | live = real orders (needs keys)
    exchange: binance              # binance, kraken, kucoin... (used by ccxt in live mode)
    symbol: BTCUSDT
    stake_usd_per_trade: 5
    take_profit_pct: 2.0           # sell when up this %
    stop_loss_pct: 1.5             # sell when down this %
    max_daily_loss_usd: 2          # circuit breaker - stop trading after this loss
    api_key: ""                    # REQUIRED only for live mode
    api_secret: ""

  affiliate_content:
    enabled: true
    articles_per_run: 2
    site_name: "The Side Hustle Desk"
    amazon_tag: ""                 # e.g. "yourid-20" -> real commission links
    custom_links: []               # e.g. [{url: "https://example.com/?ref=you", keywords: ["vpn","privacy"]}]
    openai_api_key: ""             # optional: better writing quality via OpenAI-compatible API
    openai_base_url: "https://api.openai.com/v1"
    openai_model: "gpt-4o-mini"
    wordpress:
      enabled: false
      url: ""                      # e.g. "http://localhost/wp"
      username: ""
      app_password: ""             # WP admin -> Users -> Application Passwords

  micro_tasks:
    enabled: true
    skills: ["python", "web scraping", "wordpress", "data entry"]
    min_hourly_usd: 12
    max_leads_per_run: 5
    feed_urls:
      - "https://remotive.com/api/remote-jobs?limit=60"
      - "https://jobicy.com/api/v2/remote-jobs?count=50"
      - "https://www.themuse.com/api/public/jobs?page=1"
      - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"

  bounty_scout:
    enabled: true
    skills: ["python", "javascript", "documentation"]
    max_leads_per_run: 4

  reddit_scout:
    enabled: true
    max_leads_per_run: 8
    subreddits:
      - forhire
      - slavelabour
      - hiring
      - jobbit
      - freelance_forhire
      - WebdevJobs
      - remotejs
      - PythonJobs
    keywords:
      - website
      - web development
      - wordpress
      - shopify
      - landing page
      - app
      - mobile app
      - react native
      - flutter
      - ai
      - chatgpt
      - openai
      - llm
      - chatbot
      - automation
      - integration
      - next.js
      - react
      - python
      - api

  instagram_scout:
    enabled: true
    access_token: ""              # REQUIRED: Meta Graph API token (see README "Instagram")
    user_id: ""                   # REQUIRED: your Instagram BUSINESS account id
    require_contact: true         # only notify leads that have a phone/email in caption
    hashtags: ["clinic", "dentalclinic", "dental", "physiotherapy", "ayurveda", "skincare", "hairsalon", "cafe", "boutique", "smallbusiness", "localbusiness"]
    keywords: ["need", "appointment", "booking", "call", "website", "dm", "contact", "new business"]
    max_leads_per_run: 8
